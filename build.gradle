plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { name = 'Henkelmax'; url = 'https://maven.maxhenkel.de/repository/public' }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "bmd" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    // MC 26.x jest wydawany bez obfuskacji - dlatego zadnego bloku 'mappings'
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // API Simple Voice Chat - tylko compile-time, w runtime dostarcza je sam mod SVC
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"

    // Opcjonalnie do runServer: wrzuc jar Simple Voice Chat do libs/, a wtedy
    // dev-serwer wystartuje z SVC i widac, czy plugin glosowy sie wpina.
    fileTree(dir: 'libs', include: '*.jar').each { runtimeOnly files(it) }
}

processResources {
    def ver = project.version
    inputs.property 'version', ver
    filesMatching('fabric.mod.json') {
        expand version: ver
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}
